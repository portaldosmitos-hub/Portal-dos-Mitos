<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f080b" id="tc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Portal dos Mitos</title>
<style>
/* Vermelho do blog por padrão. Para ajustar o tom, altere --brand. */
:root{--bg:#2a0c10;--surf:#3a1219;--hdr:#1f080b;--ink:#f7ece8;--mute:#d1a9a3;--line:#5c242b;--brand:#b01620;--acc:#ff8a80;--onb:#fff;--ui:system-ui,-apple-system,"Segoe UI",sans-serif;--hh:62px;--nh:60px}
:root[data-theme=light]{--bg:#f7f2f1;--surf:#fff;--hdr:#fffaf9;--ink:#2b1517;--mute:#6d5557;--line:#e6d9d7;--acc:#b01620}
html[data-theme=bw]{filter:grayscale(1)}
:root[data-theme=dark]{--bg:#141112;--surf:#221c1d;--hdr:#0f0d0e;--ink:#f1e9e8;--mute:#aa9b9a;--line:#3a3132;--brand:#c8232e;--acc:#ff7b82}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:fixed;top:0;left:0;right:0;z-index:5;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;background:var(--hdr);border-bottom:3px solid var(--brand);display:flex;align-items:center;gap:6px}
#logo{flex:1;height:100%;display:flex;align-items:center;justify-content:flex-start;padding:4px 0}
#logo img{height:52px;width:auto;display:block}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.ic.on{color:#ffc94d}
#sbar{position:fixed;z-index:5;left:0;right:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));padding:10px 12px;background:var(--hdr);border-bottom:1px solid var(--line);display:none}
#sbar.on{display:block}
#sbar input{width:100%;padding:11px 16px;border-radius:24px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:16px var(--ui)}
#views{position:fixed;left:0;right:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:calc(var(--nh) + env(safe-area-inset-bottom,0px));background:#fff}
.fr{position:absolute;inset:0;overflow:hidden;visibility:hidden;background:var(--bg)}
.fr.on{visibility:visible}
.fr iframe{border:0;display:block;width:100%;height:100%;background:#fff;position:relative}
.ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px}
.fr.ok .ld{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;height:calc(var(--nh) + env(safe-area-inset-bottom,0px))}
nav button{position:relative;overflow:hidden;flex:1;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;-webkit-tap-highlight-color:transparent;transition:color .3s}
nav button b{display:inline-block;font-weight:400;transition:transform .4s cubic-bezier(.34,1.8,.5,1)}
nav button span{transition:transform .3s,opacity .3s;opacity:.85}
nav .on{color:var(--acc);font-weight:700}
nav .on b{transform:translateY(-5px) scale(1.22)}
nav .on span{opacity:1;transform:translateY(-1px)}
.ind{position:absolute;top:-1px;bottom:env(safe-area-inset-bottom,0px);left:0;width:20%;pointer-events:none;transition:transform .5s cubic-bezier(.34,1.45,.5,1),width .4s}
.ind.nt{transition:none}
.ind::before{content:'';position:absolute;top:0;left:50%;width:36px;height:3px;margin-left:-18px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#ffdf8a,#ff8a5c,#ffdf8a);box-shadow:0 0 14px 2px rgba(255,150,90,.7)}
.ind::after{content:'';position:absolute;inset:0;background:radial-gradient(65% 80% at 50% 0,rgba(255,138,128,.26),transparent 72%)}
nav .tap b{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
nav .tap::after{content:'';position:absolute;left:50%;top:38%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--acc);opacity:.4;animation:rip .6s ease-out forwards}
@keyframes pop{0%{transform:translateY(0) scale(.75)}45%{transform:translateY(-11px) scale(1.4) rotate(-7deg)}100%{transform:translateY(-5px) scale(1.22)}}
@keyframes rip{to{transform:scale(10);opacity:0}}
@media(prefers-reduced-motion:reduce){.ind,nav b,nav span{transition:none}nav .tap b,nav .tap::after{animation:none}}
#banner{position:fixed;z-index:8;left:12px;right:12px;top:calc(var(--hh) + 10px + env(safe-area-inset-top,0px));padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center;display:none}
#banner.on{display:block}
#off{position:fixed;z-index:7;left:0;right:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));background:#000c;color:#fff;font-size:13px;text-align:center;padding:6px;display:none}
#off.on{display:block}
.panel{position:fixed;z-index:4;left:0;right:0;bottom:calc(var(--nh) + env(safe-area-inset-bottom,0px));top:calc(var(--hh) + env(safe-area-inset-top,0px));background:var(--bg);overflow-y:auto;display:none;padding:8px 16px 28px}
.panel.on{display:block}
.panel h2{font:700 15px var(--ui);color:var(--mute);margin:20px 0 4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row small{display:block;color:var(--mute);margin-top:3px;font-size:12px;line-height:1.4}
.seg{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex:none}
.seg.full{width:100%}.seg.full button{flex:1}
.seg button{padding:8px 12px;font-size:13px;white-space:nowrap}.seg .on{background:var(--brand);color:var(--onb)}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;background:var(--surf)}
.chip.on{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.fav{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.fav .go{flex:1;display:flex;align-items:center;gap:12px;text-align:left;min-width:0}
.fav .th{flex:none;width:56px;height:72px;border-radius:10px;background:var(--surf) center/cover}
.fav strong{font:700 18px/1.2 Georgia,serif;display:block}
.fav small{color:var(--mute);font-size:12px}
.empty{padding:48px 12px;text-align:center;color:var(--mute);line-height:1.6}
button.row{cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block;overflow:visible}
.i .f{fill:currentColor;stroke:none}
nav button b{display:grid;place-items:center}
nav .on .i{stroke:url(#gold);filter:drop-shadow(0 0 5px rgba(255,160,80,.55))}
nav .on .i .f{fill:url(#gold)}
.ic .i{width:25px;height:25px}
.ic.on .i{fill:url(#gold);stroke:url(#gold);filter:drop-shadow(0 0 5px rgba(255,160,80,.6))}
.row .l .i{width:22px;height:22px;color:var(--acc)}
.row .l{display:flex;align-items:center;gap:12px}
.day{display:flex;gap:14px;width:100%;text-align:left;padding:14px;margin:12px 0 4px;border-radius:16px;background:var(--surf);border:1px solid var(--line)}
.day .th{flex:none;width:76px;height:96px;border-radius:12px;background:var(--bg) center/cover}
.day small{color:var(--acc);font-weight:700;letter-spacing:.5px;font-size:11px;text-transform:uppercase}
.day strong{font:700 22px/1.1 Georgia,serif;display:block;margin:4px 0}
.day p{font-size:13px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.on{display:block}
.sh-bg{position:absolute;inset:0;background:#0009}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--brand)}
.sh-t{font:700 20px/1.25 Georgia,serif;display:block;margin-bottom:4px}
.sh-box p{color:var(--mute);font-size:14px;line-height:1.5;margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips .chip{flex:none;white-space:nowrap}
.chip.sm{font-size:12px;padding:5px 11px}
.frow{display:flex;gap:10px;align-items:center;margin:8px 0 2px}
.frow input{flex:1;min-width:0;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:15px var(--ui)}
.lnk{color:var(--acc);font-size:13px;text-decoration:underline}
#toast button{color:var(--brand);font-weight:700;padding:0 2px}
#toast{position:fixed;left:50%;bottom:calc(var(--nh) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;display:none;max-width:92%;gap:14px;align-items:center;z-index:50}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="2" y1="2" x2="22" y2="22"><stop offset="0" stop-color="#ffe49a"/><stop offset=".55" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a5c"/></linearGradient></defs></svg>
<header>
  <button id="logo" data-logo aria-label="Portal dos Mitos, ir para o início"><img src="logo-topo.png" alt="Portal dos Mitos"></button>
  <button class="ic" id="bR" aria-label="Mito aleatório"></button>
  <button class="ic" id="bS" aria-label="Buscar"></button>
  <button class="ic" id="bF" aria-label="Favoritar esta página"></button>
</header>
<div id="sbar"><input id="q" type="search" placeholder="Buscar no Portal dos Mitos" enterkeyhint="search"></div>
<div id="off">Sem conexão. O conteúdo do blog precisa de internet.</div>
<button id="banner"></button>
<div id="views"></div>
<div class="panel" id="favs"></div>
<div class="panel" id="more"></div>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<div id="sheet"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
const BLOG='https://portal-dos-mitos.blogspot.com';
const HOST=/^portal-dos-mitos\.blogspot\.com(\.br)?$/;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEC={home:'/',mapa:'/p/indice-do-blog.html',glos:'/p/glossario.html',sobre:'/p/sobre-nos.html',blog:'/p/sobre-o-blog.html',parc:'/p/parceria.html',cont:'/p/contate-nos.html'};
const TITLES={home:'Portal dos Mitos',mapa:'Mapa do Blog',glos:'Glossário',sobre:'Sobre o Autor',blog:'Sobre o Blog',parc:'Parcerias',cont:'Contato'};
const sp=(x,y,r,k=.14)=>`<path class="f" d="M${x} ${y-r}Q${x+k*r} ${y-k*r} ${x+r} ${y}Q${x+k*r} ${y+k*r} ${x} ${y+r}Q${x-k*r} ${y+k*r} ${x-r} ${y}Q${x-k*r} ${y-k*r} ${x} ${y-r}Z"/>`;
const ICONS={
 home:`<path d="M5 22V13.5a7 7 0 0 1 14 0V22"/><path d="M9 22v-8a3 3 0 0 1 6 0v8"/><path d="M3 22h18"/>${sp(12,3.4,2.6)}`,
 mapa:`<path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>${sp(12,12,2.1)}`,
 glos:`<path d="M12 6.5C9.8 5 6.5 4.5 3 4.5v14c3.5 0 6.8.5 9 2 2.2-1.5 5.5-2 9-2v-14c-3.5 0-6.8.5-9 2z"/><path d="M12 6.5v14"/>${sp(16.6,11.4,2.3)}`,
 fav:`<path d="M7 3h10v18.5l-5-4-5 4z"/>${sp(12,9.6,2.6)}`,
 more:`<path d="M3.5 6h17M3.5 18h17M3.5 12H8M16 12h4.5"/><path d="M12 8.6l3.4 3.4-3.4 3.4L8.6 12z"/>`,
 dice:`<path d="M12 2.5l8.2 4.7v9.6L12 21.5l-8.2-4.7V7.2z"/><path d="M12 8l4.6 8H7.4z"/><path d="M12 8V2.5M7.4 16l-3.6 1M16.6 16l3.6 1"/>`,
 search:`<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/>${sp(10.5,10.5,2.7)}`,
 star:`<path d="M12 2.5Q12.9 11.1 21.5 12 12.9 12.9 12 21.5 11.1 12.9 2.5 12 11.1 11.1 12 2.5z"/>`,
 share:`<path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12.5V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.5"/>`,
 link:`<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>`,
 refresh:`<path d="M20 11a8 8 0 0 0-14.5-4M4 13a8 8 0 0 0 14.5 4"/><path d="M5.5 3v4h4M18.5 21v-4h-4"/>`,
 ext:`<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>`
};
const ico=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const NAV=[['home','home','Início'],['mapa','mapa','Mapa'],['glos','glos','Glossário'],['fav','fav','Favoritos'],['more','more','Mais']];
const S={sec:'home',panel:null,theme:store.get('theme','blog'),notif:store.get('notif',false),fav:store.get('favs',[]),newest:null,latest:null,ins:null};
Object.assign(S,{zoom:store.get('zoom',1),hist:store.get('hist',[]),linked:false,day:store.get('day',null)});
const VER='1.7';
Object.assign(S,{cols:store.get('cols',[]),favQ:'',favCol:'',favTag:'',favSort:store.get('favSort','r'),toastFn:null});
S.fav.forEach(f=>{if(!Array.isArray(f.cols))f.cols=[]});
const nz=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const saveFav=()=>{store.set('favs',S.fav);store.set('cols',S.cols)};
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const frames={};
const src=p=>BLOG+p;

/* ---------- molduras com o blog real ---------- */
function layout(o){
 const z=S.zoom;
 o.f.style.cssText=z===1?'width:100%;height:100%':`width:${100/z}%;height:${100/z}%;transform:scale(${z});transform-origin:0 0`;
}
function ensure(key,path){
 if(frames[key])return frames[key];
 const box=document.createElement('div');box.className='fr';box.innerHTML='<div class="ld">Carregando o Portal dos Mitos…</div>';
 const f=document.createElement('iframe');
 f.title=TITLES[key]||'Portal dos Mitos';
 f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads');
 f.allow='clipboard-write; fullscreen';
 f.onload=()=>box.classList.add('ok');
 f.src=src(path||SEC[key]);
 box.appendChild(f);$('#views').appendChild(box);
 const o=frames[key]={box,f,cur:null};layout(o);return o;
}
function show(key,path){
 S.sec=key;S.panel=null;ensure(key,path);
 Object.entries(frames).forEach(([k,v])=>v.box.classList.toggle('on',k===key));
 syncUI();
}
const curNav=()=>S.panel||(['home','mapa','glos'].includes(S.sec)?S.sec:'more');
function buildNav(){
 $('#nav').innerHTML='<i class="ind nt" id="ind"></i>'+NAV.map(([k,i,l])=>`<button data-nav="${k}"><b>${ico(i)}</b><span>${l}</span></button>`).join('');
 $('#bR').innerHTML=ico('dice');$('#bS').innerHTML=ico('search');$('#bF').innerHTML=ico('star');
 syncUI();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{moveInd();$('#ind').classList.remove('nt')}));
}
function moveInd(){
 const b=$('#nav button[data-nav="'+curNav()+'"]'),i=$('#ind');if(!b||!i)return;
 i.style.width=b.offsetWidth+'px';i.style.transform='translateX('+b.offsetLeft+'px)';
}
addEventListener('resize',moveInd);addEventListener('load',moveInd);
function syncUI(){
 $('#favs').classList.toggle('on',S.panel==='fav');
 $('#more').classList.toggle('on',S.panel==='more');
 const cur=curNav();
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===cur));
 moveInd();
 const c=(frames[S.sec]||{}).cur;
 const b=$('#bF');b.hidden=!!S.panel;const on=!!(c&&S.fav.some(f=>f.path===c.path));b.classList.toggle('on',on);
}
function goPost(path){
 const o=ensure('home');o.box.classList.remove('ok');o.cur=null;o.f.src=src(path);show('home');
}
function resetSection(){
 const o=frames[S.sec];if(!o)return;o.box.classList.remove('ok');o.cur=null;o.f.src=src(SEC[S.sec]);syncUI();
}

/* a página do blog informa qual página está aberta (código colado no tema) */
addEventListener('message',e=>{
 const d=e.data;if(!d||d.type!=='pdm:page')return;
 let u;try{u=new URL(d.url)}catch(_){return}
 if(!HOST.test(u.hostname))return;
 const path=(u.pathname+u.search).replace(/([?&])m=1&?/,'$1').replace(/[?&]$/,'');
 for(const o of Object.values(frames)){
  if(o.f.contentWindow===e.source){
   o.cur={path,title:String(d.title||'Portal dos Mitos').slice(0,200),img:typeof d.img==='string'&&d.img.startsWith('https:')?d.img:''};
   o.box.classList.add('ok');
   S.linked=true;pushHist(o.cur);
  }
 }
 syncUI();
});

/* ---------- favoritos ---------- */
function toggleFav(){
 const c=(frames[S.sec]||{}).cur;
 if(!c){toast('Para favoritar, o blog precisa do código do app. Veja as instruções.');return}
 if(c.path==='/'){toast('Abra um mito e toque na estrela para guardá-lo.');return}
 const i=S.fav.findIndex(f=>f.path===c.path);
 if(i>=0){
  const [x]=S.fav.splice(i,1);saveFav();syncUI();
  toast('Removido dos favoritos','Desfazer',()=>{S.fav.splice(Math.min(i,S.fav.length),0,x);saveFav();syncUI()});return}
 S.fav.unshift({path:c.path,title:c.title,img:c.img,t:Date.now(),cols:[],tags:/^\/p\//.test(c.path)?[]:undefined});
 saveFav();syncUI();toast('Salvo nos favoritos','Organizar',()=>openOrganize(c.path));ensureTags();
}
async function fetchTags(paths){
 const by={},res={};
 paths.forEach(p=>{const m=p.match(/^\/(\d{4})\/(\d{2})\//);if(m)(by[m[1]+'-'+m[2]]=by[m[1]+'-'+m[2]]||[]).push(p)});
 const pad=n=>String(n).padStart(2,'0');
 for(const k of Object.keys(by)){
  const [y,mo]=k.split('-').map(Number),ny=mo===12?y+1:y,nm=mo===12?1:mo+1;
  try{const f=await getFeed(`published-min=${k}-01T00:00:00-03:00&published-max=${ny}-${pad(nm)}-01T00:00:00-03:00&max-results=500`);
   (f.entry||[]).forEach(e=>{const p=new URL((e.link.find(l=>l.rel==='alternate')||{}).href||BLOG).pathname;res[p]=(e.category||[]).map(c=>c.term)})}catch(e){}
 }
 return res;
}
let tagBusy=false;
async function ensureTags(){
 if(tagBusy)return;const need=S.fav.filter(f=>f.tags===undefined);if(!need.length)return;
 tagBusy=true;
 try{const r=await fetchTags(need.map(f=>f.path));
  need.forEach(f=>{if(r[f.path])f.tags=r[f.path];else{f.tt=(f.tt||0)+1;if(f.tt>=3||!/^\/\d{4}\/\d{2}\//.test(f.path))f.tags=[]}});
  saveFav();
 }catch(e){}
 tagBusy=false;if(S.panel==='fav')renderFavBody();
}
function favView(){
 const q=nz(S.favQ.trim());
 let L=S.fav.filter(f=>(!S.favCol||f.cols.includes(S.favCol))&&(!S.favTag||(f.tags||[]).includes(S.favTag))&&(!q||nz(f.title+' '+(f.tags||[]).join(' ')).includes(q)));
 if(S.favSort==='a')L=[...L].sort((a,b)=>a.title.localeCompare(b.title,'pt'));
 return L;
}
function favItem(f){
 const cn=f.cols.map(id=>(S.cols.find(c=>c.id===id)||{}).name).filter(Boolean).map(n=>'📁 '+n);
 const sub=[...(f.tags||[]).slice(0,2),...cn].join(' · ')||'Salvo em '+new Date(f.t).toLocaleDateString('pt-BR');
 return `<div class="fav"><button class="go" data-favgo="${esc(f.path)}"><div class="th" ${f.img?`style="background-image:url('${esc(f.img)}')"`:''}></div><div><strong>${esc(f.title)}</strong><small>${esc(sub)}</small></div></button><button class="ic" data-forg="${esc(f.path)}" aria-label="Organizar">⋯</button></div>`;
}
function renderFavBody(){
 const el=$('#fbody');if(!el)return;
 const base=S.fav.filter(f=>!S.favCol||f.cols.includes(S.favCol));
 const tc={};base.forEach(f=>(f.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
 const tags=Object.entries(tc).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt')).slice(0,14);
 const L=favView();
 el.innerHTML=`<div class="chips"><button class="chip${!S.favCol?' on':''}" data-fcol="">Todos ${S.fav.length}</button>${S.cols.map(c=>`<button class="chip${S.favCol===c.id?' on':''}" data-fcol="${esc(c.id)}">📁 ${esc(c.name)} ${S.fav.filter(f=>f.cols.includes(c.id)).length}</button>`).join('')}<button class="chip" data-colnew>＋ Coleção</button></div>`
 +(S.favCol?`<div class="meta" style="padding:0 2px 6px;font-size:13px;color:var(--mute)"><button class="lnk" data-colren="${esc(S.favCol)}">Renomear</button> · <button class="lnk" data-coldel="${esc(S.favCol)}">Excluir coleção</button></div>`:'')
 +(tags.length?`<div class="chips">${tags.map(([t,n])=>`<button class="chip sm${S.favTag===t?' on':''}" data-ftag="${esc(t)}">${esc(t)} ${n}</button>`).join('')}</div>`:'')
 +(L.length?L.map(favItem).join(''):`<div class="empty">Nada por aqui${S.favQ||S.favTag||S.favCol?' com esses filtros':' ainda'}.</div>`);
}
function renderFavs(){
 if(!S.fav.length){$('#favs').innerHTML='<div class="empty">Você ainda não guardou nenhum mito.<br>Abra uma página do blog e toque em ☆ no topo.<br>Depois você poderá organizar em coleções.</div>';return}
 $('#favs').innerHTML=`<div class="frow"><input id="fq" type="search" placeholder="Buscar nos favoritos" value="${esc(S.favQ)}"><div class="seg"><button data-fsort="r" class="${S.favSort==='r'?'on':''}">Recentes</button><button data-fsort="a" class="${S.favSort==='a'?'on':''}">A–Z</button></div></div><div id="fbody"></div>`;
 renderFavBody();ensureTags();
}
function openSheet(html){$('#sheet').innerHTML=`<div class="sh-bg" data-sheetclose></div><div class="sh-box">${html}</div>`;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');if(S.panel==='fav')renderFavs()}
function openOrganize(path){
 const f=S.fav.find(x=>x.path===path);if(!f)return;
 openSheet(`<strong class="sh-t">${esc(f.title)}</strong><h2 style="font:700 13px var(--ui);color:var(--mute);margin:14px 0 2px">COLEÇÕES</h2>
 ${S.cols.length?S.cols.map(c=>`<button class="row" data-colset="${esc(c.id)}" data-p="${esc(path)}"><span>📁 ${esc(c.name)}</span><span>${f.cols.includes(c.id)?'✓':''}</span></button>`).join(''):'<p>Você ainda não criou coleções.</p>'}
 <button class="row" data-colnew data-p="${esc(path)}"><span>＋ Nova coleção</span></button>
 <button class="row" data-favrm="${esc(path)}"><span style="color:var(--acc)">Remover dos favoritos</span></button>
 <button class="chip on" style="margin-top:14px;width:100%;padding:12px" data-sheetclose>Concluir</button>`);
}
function newCol(path){
 const name=(prompt('Nome da coleção:')||'').trim().slice(0,40);if(!name)return;
 const id='c'+Date.now().toString(36);S.cols.push({id,name});
 const f=path&&S.fav.find(x=>x.path===path);if(f)f.cols.push(id);else S.favCol=id;
 saveFav();if(f)openOrganize(path);else renderFavBody();
}

/* ---------- menu Mais ---------- */
function renderMore(){
 const np='Notification' in window?Notification.permission:'unsupported';
 const link=(k,l)=>`<button class="row" data-sec="${k}"><span>${l}</span><span>›</span></button>`;
 const act=(a,i,l,r='›')=>`<button class="row" data-${a}><span class="l">${ico(i)}<span>${l}</span></span><span>${r}</span></button>`;
 $('#more').innerHTML=`<div id="dayCard">${dayHtml()}</div>
  ${S.hist.length?`<h2>Lidos recentemente</h2>${S.hist.slice(0,6).map((h,i)=>`<button class="row" data-hist="${i}"><span>${esc(h.title)}</span><span>›</span></button>`).join('')}`:''}
 <h2>Esta página</h2>
 ${act('share','share','Compartilhar','')}${act('copy','link','Copiar link','')}
 <div class="row"><span>Tamanho do texto</span><div class="seg"><button data-zoom="-1" aria-label="Diminuir">A−</button><span style="padding:8px 6px;font-size:13px;color:var(--mute)">${Math.round(S.zoom*100)}%</span><button data-zoom="1" aria-label="Aumentar">A+</button></div></div>
 <h2>Páginas do blog</h2>${link('sobre','Sobre o Autor')}${link('blog','Sobre o Blog')}${link('parc','Parcerias')}${link('cont','Contato')}
 <h2>Ajustes do app</h2>
 <div class="row"><div>Avisar sobre novos mitos<small>${np==='denied'?'Bloqueado nas configurações do navegador.':'Enquanto o app estiver aberto ou instalado.'}</small></div><button class="chip ${S.notif?'on':''}" data-notif>${S.notif?'Ativado ✓':'Ativar'}</button></div>
 <div class="row" style="flex-wrap:wrap"><div>Cores do app<small>${S.theme==='bw'?'Preto e branco: o app inteiro em tons de cinza, igual ao modo do blog.':'Vermelho, claro, escuro ou preto e branco.'}</small></div><div class="seg full">${[['blog','Vermelho'],['light','Claro'],['dark','Escuro'],['bw','P&amp;B']].map(([k,l])=>`<button data-theme="${k}" class="${S.theme===k?'on':''}">${l}</button>`).join('')}</div></div>
 ${standalone()?'':`<div class="row"><div>Instalar na tela inicial<small>${S.ins?'Pronto para instalar.':'Toque para ver como instalar.'}</small></div><button class="chip on" data-install>Instalar</button></div>`}
 <h2>Dados e manutenção</h2>
 <div class="row"><div>Backup dos favoritos<small>Guarde em arquivo ou traga de outro aparelho.</small></div><span style="display:flex;gap:8px"><button class="chip" data-export>Exportar</button><button class="chip" data-import>Importar</button></span></div>
 ${S.hist.length?`<button class="row" data-clearhist><span>Limpar lidos recentemente</span><span>✕</span></button>`:''}
 <div class="row"><div>Integração com o blog<small>Necessária para Favoritos, Lidos recentemente e Compartilhar.</small></div><span>${S.linked?'Ativa ✓':'Não detectada'}</span></div>
 ${act('update','refresh','Atualizar o app','')}
 ${act('ext','ext','Abrir o blog no navegador','')}
 <p style="color:var(--mute);font-size:12px;line-height:1.5;margin-top:18px">Este app mostra o Portal dos Mitos diretamente do blog, com todos os recursos do site. Conteúdo e imagens: Portal dos Mitos. Versão ${VER}.</p>`;
 fillDay();
}

/* ---------- novos posts e notificações ---------- */
function jsonp(url){return new Promise((ok,no)=>{const cb='cb'+Date.now(),s=document.createElement('script'),t=setTimeout(()=>{no(new Error('timeout'));s.remove()},12000);
 window[cb]=d=>{clearTimeout(t);ok(d);s.remove();delete window[cb]};s.onerror=()=>{clearTimeout(t);no(new Error('jsonp'));s.remove()};
 s.src=url+'&alt=json-in-script&callback='+cb;document.head.appendChild(s)})}
async function latest(){
 const u=BLOG+'/feeds/posts/default?max-results=1';let j;
 try{const r=await fetch(u+'&alt=json');if(!r.ok)throw 0;j=await r.json()}catch(e){j=await jsonp(u)}
 const e=j.feed.entry[0],html=e.content?e.content.$t:'';
 const href=(e.link.find(l=>l.rel==='alternate')||{}).href||BLOG;
 return{id:e.id.$t.split('post-')[1]||e.id.$t,title:e.title.$t,path:new URL(href).pathname,text:html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().replace(/^۞?\s*ADM \w+\s*/,'').slice(0,120)};
}
const seen=async()=>{try{const r=await (await caches.open('pdm-meta')).match('/lastseen');return r?await r.text():null}catch(e){return null}};
const setSeen=async id=>{try{await (await caches.open('pdm-meta')).put('/lastseen',new Response(id))}catch(e){}};
async function notify(n){
 const o={body:n.text,icon:'icon-192.png',badge:'icon-192.png',tag:'mito-'+n.id,data:{path:n.path}};
 try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification('Novo mito: '+n.title,o);else new Notification('Novo mito: '+n.title,o)}catch(e){}
}
async function toggleNotif(){
 if(S.notif){S.notif=false;store.set('notif',false);renderMore();return}
 if(!('Notification' in window)){toast('Este navegador não oferece notificações.');return}
 if(await Notification.requestPermission()!=='granted'){toast('Permissão negada. Libere nas configurações do navegador.');return}
 S.notif=true;store.set('notif',true);if(S.newest)setSeen(S.newest);
 try{const r=await navigator.serviceWorker.ready;await r.periodicSync.register('novos-mitos',{minInterval:12*3600*1000})}catch(e){}
 toast('Avisos ativados');renderMore();
}
async function poll(){
 if(document.hidden&&!S.notif)return;
 try{const n=await latest();
  if(!S.newest){S.newest=n.id;if(S.notif)setSeen(n.id);return}
  if(n.id!==S.newest){S.latest=n;const b=$('#banner');b.textContent='Novo mito: '+n.title+'. Toque para abrir.';b.classList.add('on');
   if(S.notif&&Notification.permission==='granted'&&await seen()!==n.id){notify(n);setSeen(n.id)}}
 }catch(e){}
}
setInterval(poll,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* ---------- recursos do menu Mais ---------- */
async function getFeed(params){
 const u=BLOG+'/feeds/posts/default?'+params;let j;
 try{const r=await fetch(u+'&alt=json');if(!r.ok)throw 0;j=await r.json()}catch(e){j=await jsonp(u)}
 return j.feed;
}
function info(e){
 const html=e.content?e.content.$t:'',m=html.match(/<img[^>]+src="([^"]+)"/);
 const href=(e.link.find(l=>l.rel==='alternate')||{}).href||BLOG;
 return{title:e.title.$t,path:new URL(href).pathname,img:m?m[1]:'',text:html.replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim().replace(/^۞?\s*ADM \w+\s*/,'').slice(0,140)};
}
async function nth(i){const f=await getFeed('max-results=1&start-index='+i);return{total:+f.openSearch$totalResults.$t,item:f.entry&&f.entry[0]?info(f.entry[0]):null}}
const dayHtml=()=>S.day?`<button class="day" data-goto="${esc(S.day.path)}"><div class="th" ${S.day.img?`style="background-image:url('${esc(S.day.img)}')"`:''}></div><div><small>Mito do dia</small><strong>${esc(S.day.title)}</strong><p>${esc(S.day.text)}</p></div></button>`:'';
async function fillDay(){
 const today=new Date().toLocaleDateString('sv');
 if(!S.day||S.day.d!==today){
  try{
   const n=(await nth(1)).total,idx=((+today.replace(/-/g,''))*7919)%n+1,r=await nth(idx);
   if(r.item){S.day={d:today,...r.item};store.set('day',S.day)}
  }catch(e){}
 }
 const el=$('#dayCard');if(el)el.innerHTML=dayHtml();
}
async function randomMyth(){
 toast('Sorteando um mito…');
 try{const t=(await nth(1)).total,r=await nth(1+Math.floor(Math.random()*t));if(r.item)goPost(r.item.path)}
 catch(e){toast('Não foi possível sortear agora.')}
}
function pushHist(c){
 if(!/^\/\d{4}\/\d{2}\//.test(c.path))return;
 S.hist=S.hist.filter(h=>h.path!==c.path);S.hist.unshift({path:c.path,title:c.title,img:c.img,t:Date.now()});
 S.hist=S.hist.slice(0,30);store.set('hist',S.hist);
}
function curPage(){const c=(frames[S.sec]||{}).cur;if(!c)toast('Abra uma página do blog primeiro. Requer o código instalado no blog.');return c}
async function sharePage(){
 const c=curPage();if(!c)return;const url=BLOG+c.path;
 try{if(navigator.share)await navigator.share({title:c.title,url});else{await navigator.clipboard.writeText(url);toast('Link copiado')}}catch(_){}
}
async function copyLink(){const c=curPage();if(!c)return;try{await navigator.clipboard.writeText(BLOG+c.path);toast('Link copiado')}catch(e){toast('Não foi possível copiar')}}
const ZS=[.8,.9,1,1.1,1.2,1.3,1.4];
function setZoom(d){
 const i=Math.max(0,Math.min(ZS.length-1,ZS.indexOf(S.zoom)+d));
 S.zoom=ZS[i];store.set('zoom',S.zoom);Object.values(frames).forEach(layout);renderMore();
}
function exportFav(){
 if(!S.fav.length){toast('Nenhum favorito para exportar');return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:2,favs:S.fav,cols:S.cols},null,1)],{type:'application/json'}));
 a.download='favoritos-portal-dos-mitos.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('#imp').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const data=JSON.parse(await f.text()),favs=Array.isArray(data)?data:(data.favs||[]),cols=Array.isArray(data)?[]:(data.cols||[]);
  const idmap={};
  cols.forEach(c=>{if(!c||typeof c.name!=='string')return;let ex=S.cols.find(x=>x.name===c.name);if(!ex){ex={id:'c'+Math.random().toString(36).slice(2,9),name:c.name.slice(0,40)};S.cols.push(ex)}idmap[c.id]=ex.id});
  let n=0;
  favs.forEach(x=>{if(x&&typeof x.path==='string'&&x.path.startsWith('/')&&!S.fav.some(y=>y.path===x.path)){
   S.fav.push({path:x.path.slice(0,300),title:String(x.title||x.path).slice(0,200),img:typeof x.img==='string'&&x.img.startsWith('https:')?x.img:'',t:+x.t||Date.now(),
    cols:Array.isArray(x.cols)?x.cols.map(i=>idmap[i]).filter(Boolean):[],tags:Array.isArray(x.tags)?x.tags.map(String).slice(0,20):undefined});n++}});
  saveFav();syncUI();toast(n+' favoritos importados');
 }catch(_){toast('Arquivo inválido')}
});
async function updateApp(){
 toast('Atualizando o app…');
 try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));
  const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('pdm-shell')).map(k=>caches.delete(k)))}catch(e){}
 location.reload();
}

/* ---------- utilitários ---------- */
let tt;function toast(m,label,fn){
 const t=$('#toast');S.toastFn=fn||null;
 t.innerHTML=`<span>${esc(m)}</span>${label?`<button data-toastact>${esc(label)}</button>`:''}`;
 t.style.display='flex';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',label?6000:3600);
}
function applyTheme(){const r=document.documentElement;S.theme==='blog'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme);$('#tc').content=getComputedStyle(r).getPropertyValue('--hdr').trim()||'#1f080b'}
function online(){$('#off').classList.toggle('on',!navigator.onLine)}
addEventListener('online',online);addEventListener('offline',online);

document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if('logo' in d){show('home');return}
 if(d.nav){
  const k=d.nav;t.classList.add('tap');setTimeout(()=>t.classList.remove('tap'),650);if(navigator.vibrate)navigator.vibrate(8);
  if(k==='fav'||k==='more'){S.panel=S.panel===k?null:k;if(S.panel==='fav')renderFavs();if(S.panel==='more')renderMore();syncUI();return}
  if(S.sec===k&&!S.panel){resetSection();return}
  show(k);return}
 if(d.sec){show(d.sec);return}
 if('toastact' in d){const fn=S.toastFn;$('#toast').style.display='none';if(fn)fn();return}
 if('sheetclose' in d){closeSheet();return}
 if(d.favgo!==undefined){goPost(d.favgo);return}
 if(d.forg!==undefined){openOrganize(d.forg);return}
 if(d.fcol!==undefined){S.favCol=d.fcol;S.favTag='';renderFavBody();return}
 if(d.ftag!==undefined){S.favTag=S.favTag===d.ftag?'':d.ftag;renderFavBody();return}
 if(d.fsort){S.favSort=d.fsort;store.set('favSort',S.favSort);renderFavs();return}
 if('colnew' in d){newCol(d.p);return}
 if(d.colset){const f=S.fav.find(x=>x.path===d.p);if(f){const i=f.cols.indexOf(d.colset);i>=0?f.cols.splice(i,1):f.cols.push(d.colset);saveFav();openOrganize(d.p)}return}
 if(d.colren){const c=S.cols.find(x=>x.id===d.colren);const n=c&&(prompt('Novo nome da coleção:',c.name)||'').trim().slice(0,40);if(n){c.name=n;saveFav();renderFavBody()}return}
 if(d.coldel){const c=S.cols.find(x=>x.id===d.coldel);if(c&&confirm('Excluir a coleção "'+c.name+'"? Os mitos continuam nos favoritos.')){S.cols=S.cols.filter(x=>x.id!==c.id);S.fav.forEach(f=>f.cols=f.cols.filter(i=>i!==c.id));S.favCol='';saveFav();renderFavBody()}return}
 if(d.favrm){const i=S.fav.findIndex(x=>x.path===d.favrm);if(i>=0){const [x]=S.fav.splice(i,1);saveFav();closeSheet();syncUI();toast('Removido dos favoritos','Desfazer',()=>{S.fav.splice(Math.min(i,S.fav.length),0,x);saveFav();syncUI();if(S.panel==='fav')renderFavs()})}return}
  if(t.id==='bF'){toggleFav();return}
 if(t.id==='bR'){randomMyth();return}
 if(t.id==='bS'){const s=$('#sbar');s.classList.toggle('on');if(s.classList.contains('on'))$('#q').focus();return}
 if(t.id==='banner'){t.classList.remove('on');if(S.latest){S.newest=S.latest.id;goPost(S.latest.path)}return}
 if(d.theme){S.theme=d.theme;store.set('theme',S.theme);applyTheme();renderMore();return}
 if('notif' in d){toggleNotif();return}
 if('install' in d){
  if(S.ins){const p=S.ins;S.ins=null;p.prompt();p.userChoice.then(r=>{if(r.outcome==='accepted')toast('Instalando…');renderMore()})}
  else installHelp();
  return}
 if('rand' in d){randomMyth();return}
 if(d.goto){goPost(d.goto);return}
 if(d.hist!==undefined){const h=S.hist[+d.hist];if(h)goPost(h.path);return}
 if('share' in d){sharePage();return}
 if('copy' in d){copyLink();return}
 if(d.zoom){setZoom(+d.zoom);return}
 if('export' in d){exportFav();return}
 if('import' in d){$('#imp').click();return}
 if('clearhist' in d){S.hist=[];store.set('hist',[]);renderMore();return}
 if('update' in d){updateApp();return}
 if('ext' in d){window.open(BLOG,'_blank','noopener')}
});
document.addEventListener('input',e=>{if(e.target.id==='fq'){S.favQ=e.target.value;renderFavBody()}});
$('#q').addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;const v=e.target.value.trim();if(!v)return;
 e.target.blur();$('#sbar').classList.remove('on');goPost('/search?q='+encodeURIComponent(v));
});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.ins=e;if(S.panel==='more')renderMore()});
addEventListener('appinstalled',()=>{S.ins=null;toast('App instalado!');if(S.panel==='more')renderMore()});
function installHelp(){
 const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),and=/Android/.test(ua);
 const how=ios?'No Safari, toque em <b>Compartilhar</b> (o quadrado com uma seta) e depois em <b>Adicionar à Tela de Início</b>.'
  :and?'No Chrome, toque no menu <b>⋮</b> (canto superior direito) e escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.'
  :'No Chrome ou no Edge, clique no ícone de instalação na barra de endereços, ou abra o menu e escolha <b>Instalar</b>.';
 openSheet(`<strong class="sh-t">Instalar o app</strong><p>${how}</p><p>O botão de instalação automática depende do navegador, que decide quando liberá-lo. O caminho acima funciona a qualquer momento.</p><button class="chip on" style="margin-top:10px;width:100%;padding:12px" data-sheetclose>Entendi</button>`);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
 navigator.serviceWorker.register('sw.js').catch(()=>{});
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.go)goPost(e.data.go)});
}

buildNav();applyTheme();online();
const go=new URLSearchParams(location.search).get('go');
if(go){history.replaceState(null,'',location.pathname);goPost(go)}else show('home');
poll();
</script>
